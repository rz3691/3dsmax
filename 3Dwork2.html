<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的3D书柜</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f5f5f5; }
        canvas { display: block; }
    </style>
    <!-- 引入 Three.js 官方核心库 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- 3D 场景控制逻辑 -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- 1. 场景搭建 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f5f5); // 柔和背景

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 9);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace; // 还原真实色彩
        document.body.appendChild(renderer.domElement);

        // --- 2. 灯光系统 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(5, 8, 8);
        scene.add(dirLight);

        // --- 3. 鼠标交互控制 (已关闭自动旋转) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false; // 确保自动旋转已关闭

        // --- 4. 加载书柜模型 ---
        const loader = new GLTFLoader();
        loader.load('./3D/bookshelf.glb', function (gltf) {
            const model = gltf.scene;

            // *** 核心修正：赋予模型真实的高级哑光质感 ***
            model.traverse((child) => {
                if (child.isMesh) {
                    child.material.roughness = 0.8;  // 增加表面粗糙度，呈现真实漫反射
                    child.material.metalness = 0.0;  // 去除多余金属感
                    child.material.needsUpdate = true;
                }
            });

            // 自动居中与缩放
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 6.5 / maxDim;
            
            model.scale.setScalar(scale);
            model.position.x = -center.x * scale;
            model.position.y = -center.y * scale;
            model.position.z = -center.z * scale;
            
            scene.add(model);
        }, undefined, function (error) {
            console.error('模型加载失败:', error);
        });

        // --- 5. 窗口自适应 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 6. 动画渲染循环 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
